- import_tasks: user_version_var_verification.yml

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: yes
  become: true

- name: Uninstall conflicting Docker packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
    purge: yes
  loop:
    - docker.io
    - docker-doc
    - docker-compose
    - docker-compose-v2
    - podman-docker
    - containerd
    - runc
  become: true
  ignore_errors: yes 

- name: Set Distro codename for Docker repo
  set_fact:
    docker_distro_codename: >-
      {% if ansible_distribution == 'Linux Mint' %}
        {{ mint_to_ubuntu[ansible_distribution_release] }}
      {% else %}
        {{ ansible_distribution_release }}
      {% endif %}
    docker_os: "{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}"

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings/
    state: directory
    mode: '0755'
  become: true

- name: Download Docker GPG key
  ansible.builtin.get_url: 
    url: https://download.docker.com/linux/{{ docker_os }}/gpg 
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

- name: Get Suites value from os-release
  ansible.builtin.shell: |
    {% if ansible_distribution == 'Debian' %}
    . /etc/os-release && echo "$VERSION_CODENAME"
    {% else %}
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
    {% endif %}
  register: suites_codename
  changed_when: false

- name: Add Docker apt repository (DEB822 format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ docker_os }}
      Suites: {{ suites_codename.stdout | trim }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

- name: Remove old Docker repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Update apt package index
  ansible.builtin.apt:
    update_cache: yes
  become: true

- import_tasks: install_selected_version.yml
